server:
  port: ${APP_PORT}
  shutdown: graceful

spring:
  application:
    name: auth-server
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      app_db_user: ${DB_USER}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  session:
    timeout: 15m
    data:
      redis:
        repository-type: indexed

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  issuer-uri: ${APP_ISSUER_URI:http://localhost:${APP_PORT}}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY}
